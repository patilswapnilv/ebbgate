name: Release

# Publishes the `ebbgate` package to npm. Never runs on push to a branch:
# only when a `v*` tag is pushed or someone starts it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version $version" >&2
            exit 1
          fi
      - name: Pack and smoke-test the tarball
        run: |
          mkdir -p /tmp/pack /tmp/try
          pnpm --filter ebbgate pack --pack-destination /tmp/pack
          cd /tmp/try && npm init -y >/dev/null
          npm install /tmp/pack/ebbgate-*.tgz
          npx ebbgate demo --fast
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false
        run: pnpm --filter ebbgate publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
