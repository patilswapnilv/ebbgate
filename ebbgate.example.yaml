# Ebbgate example config. Copy to ebbgate.yaml and set the env vars it references.
# Rules are first-match. Private tasks can never be routed to the cloud:
# a config that could do so is rejected at startup.

server:
  port: 8790
  # Presence agents on other machines must reach publicUrl. 0.0.0.0 listens on every
  # interface: limit access with a firewall or VPN (e.g. bind your Tailscale IP instead).
  # The built-in default, when host is omitted, is 127.0.0.1 (this machine only).
  host: 0.0.0.0
  publicUrl: http://cloud:8790
  maxBodyBytes: 1048576 # requests larger than this get HTTP 413
  runnerTimeoutMs: 600000 # one forward to a runner, including its response body

nodes:
  mini: { runner: http://mini:8787, token: "${EG_NODE_MINI_TOKEN}" }
  mbp: { runner: http://mbp:8787, token: "${EG_NODE_MBP_TOKEN}", prefer: true }

cloud:
  runner: http://openclaw:18789/paperclip # cloud runtime target (TODO(verify-paperclip): path)

paperclip:
  apiUrl: http://paperclip:3100
  apiKey: "${PAPERCLIP_API_KEY}"
  sharedSecret: "${EG_PAPERCLIP_SECRET}"
  # Also label deferred issues `waiting-for-local`. Off by default: Paperclip replaces
  # an issue's whole label set on update, so a concurrent label change could be lost.
  labelDeferred: false

# Tier is decided here, never by the caller. Unknown agents are treated as private.
agents:
  agent_inbox: { tier: private }
  agent_finance: { tier: private }
  agent_ops: { tier: internal }
  agent_research: { tier: public }

policies:
  - match: { label: local-files }
    available: local
    busy: local-low
    offline: defer
    notify: true
  - match: { tier: private }
    available: local
    busy: local-low
    offline: defer
  - match: { tier: internal }
    available: local
    busy: cloud
    offline: cloud
  - default:
      available: cloud
      busy: cloud
      offline: cloud

presence:
  offlineAfterSeconds: 90
  drainConcurrency: 2
  deferredMaxAgeHours: 72 # default TTL for deferred tasks (per agent: agents.<id>.deferTtlHours)

# Durable defer queue (optional; defaults shown). See docs/durable-queue.md.
# queue:
#   maxAttempts: 10           # wake attempts before a task is dead-lettered
#   retryBaseSeconds: 5       # first retry delay, doubles per attempt
#   retryMaxSeconds: 900      # retry delay cap
#   leaseSeconds: 300         # an unconfirmed claim is reclaimed after this
#   shutdownGraceSeconds: 10  # how long SIGTERM waits for in-flight work

notify:
  telegram: { botToken: "${TG_BOT_TOKEN}", chatId: "${TG_CHAT_ID}" }
  webhook: { url: "${EG_NOTIFY_WEBHOOK}" }
